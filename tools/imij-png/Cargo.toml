[package]
name = "imij-png"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
imij = { path = "../../imij" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "eaf282322b56b901ad05d534e9e95a390f06ae93", default-features = false }

enough = "0.4.4"
zencodec = { version = "0.1.27", default-features = false }
zenpixels = { version = "0.2.16", default-features = false }

[dev-dependencies]
zenpixels-convert = { version = "0.2.16", default-features = false }
png = "0.18.1"
imij-oracle = { path = "../imij-oracle", version = "0.0.1" }
imgref = "1.12.3"
rgb = "0.8.53"

[patch.crates-io]
# Match IMI and zenpng's unreleased shared animation/pixel APIs.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "5ed2daded81407e7206fd8de6e8f1d93a5447b5b" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "789d69dbc314e748676b7f2f19542c17473ba40b" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "789d69dbc314e748676b7f2f19542c17473ba40b" }
zenflate = { git = "https://github.com/imazen/zenflate", rev = "9f8684bf789297bb8bf043bc9d43f2c3b6f5dae2" }
