[package]
name = "imij-web"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings of the imij decoder for browser Web Workers"
publish = false

# Own workspace: browser deps (wasm-bindgen) are not part of the imij workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["full"]
# General image, sequence and archive bindings. The Explorer needs only pyramids.
full = ["dep:garb", "dep:imij-set", "near-lossless"]
# Optional import of V2 and V3 images. The Explorer catalog is entirely V4.
v3 = ["imij/v3"]
extended = ["imij/extended"]
near-lossless = ["imij/near-lossless"]
# Opt-in benchmark binding; does not enlarge the shipped browser decoder.
streaming-evaluation = ["full"]
# Rayon inside wasm through wasm-bindgen-rayon: needs SharedArrayBuffer (a
# cross-origin isolated page), a nightly toolchain with -Z build-std and
# +atomics,+bulk-memory. Built by scripts/build-wasm.sh threads; the default
# build is single-threaded SIMD128. Both produce identical pixels.
threads = ["imij/rayon", "dep:wasm-bindgen-rayon", "dep:rayon"]

[dependencies]
# Shared code-value preview; no color-management machinery.
garb = { version = "0.2.8", default-features = false, optional = true }
# V4 baseline browser decoder. Full-width fixtures opt in to extended.
imij = { path = "../../../../imij", default-features = false, features = ["std"] }
imij-set = { path = "../../../../imij-set", default-features = false, optional = true }
# Pinned to the wasm-bindgen CLI version the build script installs (0.2.127);
# js-sys 0.3.104 pairs with it exactly. Bump both together with the CLI.
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
zencodec = { git = "https://github.com/imazen/zencodec", rev = "119f31336e3d9a32aa7d78290cfc17035b78f050", default-features = false }
how-far-along = { git = "https://github.com/imazen/how-far", rev = "571bf1a2fc92e5b99c3777f8ff81bafab7666a75" }
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"], optional = true }
# Direct dep only for the `rayonThreads` diagnostic (the pool size the decoder
# actually got); wasm-bindgen-rayon already pulls rayon in.
rayon = { version = "1.12.0", optional = true }

# Tests create input images; production browser builds remain decoder-only.
[dev-dependencies]
imij = { path = "../../../../imij", default-features = false, features = ["std", "extended", "encode"] }

[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

# Separate workspaces must resolve the same pixel types as zencodec.
[patch.crates-io]
how-far = { git = "https://github.com/imazen/how-far", rev = "571bf1a2fc92e5b99c3777f8ff81bafab7666a75" }
# Exact common animation timing; coordinated with zenpng's native-color APIs.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "119f31336e3d9a32aa7d78290cfc17035b78f050" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "3286169c7ef5b1e66ac841c3d8204eb54e390f8c" }
