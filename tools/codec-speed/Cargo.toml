[package]
name = "imij-codec-speed"
version = "0.0.1"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
inspect = ["imij/lab"]
lab = ["imij/lab"]

[[bin]]
name = "lossy_blockiness"
path = "src/bin/lossy_blockiness.rs"
required-features = ["lab"]

[[bin]]
name = "inspect_tier"
path = "src/bin/inspect_tier.rs"
required-features = ["inspect"]

[workspace]

[dependencies]
fast-ssim2 = { git = "https://github.com/imazen/fast-ssim2", rev = "ebcd7f567b51d33777b124e877ff196866829f37" }
zencodec-png = { package = "zencodec", version = "=0.1.26", default-features = false }
zencodec = { version = "0.1.27", git = "https://github.com/imazen/zencodec", rev = "5ed2daded81407e7206fd8de6e8f1d93a5447b5b", default-features = false }
imij = { path = "../../imij" }
imij-set = { path = "../../imij-set" }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "007920fb63fbfa839ecc7cd111b5a6db731b8ecc", default-features = false, features = ["parallel"] }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "1df6b2f8cf001fb253313c2f0060bed3b36d5b4d", default-features = false }
zenbitmaps = { git = "https://github.com/imazen/zenbitmaps", rev = "32376ef8b4f6f765ff8b9964599ec2468683e77a", default-features = false, features = ["qoi"] }
enough = "0.4.4"
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "lzw"] }
zenresize = "=0.3.1"
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "789d69dbc314e748676b7f2f19542c17473ba40b", default-features = false, features = ["std", "cms-moxcms"] }
imgref = "1.12.3"
rgb = "0.8.53"
rayon = "1.12.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false }

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[patch.crates-io]
how-far = { git = "https://github.com/imazen/how-far", rev = "571bf1a2fc92e5b99c3777f8ff81bafab7666a75" }
# Keep shared pixel types identical to the current IMI adapter dependency.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "789d69dbc314e748676b7f2f19542c17473ba40b" }
# Current zenjpeg requires this not-yet-published version.
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "417cc785b83bee0b3f827ae85c5203f5e104a308" }
zenflate = { git = "https://github.com/imazen/zenflate", rev = "9f8684bf789297bb8bf043bc9d43f2c3b6f5dae2" }

# The shared production core has std-gated test helpers. This tool is always std.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("std"))'] }
