[package]
name = "imij"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Codec for the IMI image format: lossless, near-lossless and lossy images, animations, pages and region reads"
publish = false

[features]
# Encoding is optional. Some V4 writers use an internal V3-to-V4 conversion.
encode = ["v3", "near-lossless"]
blake3 = ["dep:blake3"]
sha2 = ["dep:sha2"]
# Historical v2 native-component experiment. Never accepted by v3 or upgrades.
native-jpeg = ["v3"]
# Decode historical V2 and V3 images. The default native build retains migration support.
v3 = []
default = ["encode", "std", "extended", "avx512", "rayon"]
# Entropy-coder experiments used by imij-bench (not part of the format).
lab = ["encode"]
# Signed integers and 32-/64-bit sample coding. Baseline decodes U8, U16 and F16.
extended = []
# Bounded numeric residuals. Exact-only readers can omit the reconstruction kernels.
near-lossless = []
std = ["archmage/std", "magetypes/std", "zenhash/std", "zenpixels/std"]
# Encoder and lossy-decode work on the current Rayon pool (global or
# caller-installed). The lossless decode driver still uses scoped native threads.
rayon = ["std", "dep:rayon"]
# AVX-512 (v4x) variants of the magetypes kernels and of zenhash's XXH3 accumulator;
# dispatch is still by runtime detection.
avx512 = ["zenhash/avx512"]

[dependencies]
blake3 = { version = "1.8.7", default-features = false, optional = true, features = ["pure"] }
bytemuck = { version = "1.25.2", default-features = false, features = ["extern_crate_alloc"] }
sha2 = { version = "0.11.1", default-features = false, optional = true }
# Portable primitive math when no dependency links std. Std call sites retain
# their inherent operations; these are already present in the resolved graph.
libm = { version = "0.2.16", default-features = false }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
how-far = { version = "0.1.0", git = "https://github.com/imazen/how-far", rev = "571bf1a2fc92e5b99c3777f8ff81bafab7666a75" }
archmage = { version = "0.9.33", default-features = false, features = ["avx512"] }
# ISO 21496-1 gain map metadata (typed parameters, binary form).
zencodec = { version = "0.2.0", git = "https://github.com/imazen/zencodec", rev = "119f31336e3d9a32aa7d78290cfc17035b78f050", default-features = false }
zenpixels = { version = "0.3.1", git = "https://github.com/imazen/zenpixels", rev = "3286169c7ef5b1e66ac841c3d8204eb54e390f8c", default-features = false }
magetypes = { version = "0.9.33", default-features = false, features = ["avx512"] }
rayon = { version = "1.12.0", optional = true }
# XXH3 for the optional `cSUM` file checksum. Git pin until zenhash 0.1.0 is on
# crates.io; switch to the crates.io release before any imij publish.
zenhash = { git = "https://github.com/imazen/zenhash", rev = "ce2bbdf669b90513d30d8dd86ad764ee3de68c6e", default-features = false }

[dev-dependencies]
# PR85 retained-plan allocation oracle; test binaries only.
allocation-counter = "0.8.1"
# zencodec conformance checks (streaming output honesty), from the same commit
# as the zencodec dependency.
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "119f31336e3d9a32aa7d78290cfc17035b78f050" }
how-far-along = { version = "0.1.0", git = "https://github.com/imazen/how-far", rev = "571bf1a2fc92e5b99c3777f8ff81bafab7666a75" }
fast-ssim2 = { version = "0.8.2", features = ["imgref"] }
# Independent XXH3 implementation: the reference the `cSUM` digests are checked against.
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
imgref = "1.12.3"
rayon = "1.12.0"
# Lets token-permutation tests disable compile-time-guaranteed tokens (NEON on
# aarch64), so their scalar arms really run. Test, example and bench builds
# only; never add it to [dependencies] (archmage's own guidance).
archmage = { version = "0.9.33", default-features = false, features = ["testable_dispatch"] }

# Callgrind runs on native hosts; keeping it out of WASM lets the same
# parity example build there without a copied checker in a second crate.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
gungraun = "0.20.0"
zenbench = { version = "0.1.11", git = "https://github.com/imazen/zenbench", rev = "73302a1c115836b2646f6a9adc32058c20d1a66f", default-features = false, features = ["precise-timing"] }
serde_json = "1.0.151"
sha2 = "0.11.1"

# Instruction counts under callgrind (gungraun; needs `cargo install
# gungraun-runner@0.20.0`). Valgrind has no AVX-512: this measures the AVX2
# kernels.
[[bench]]
name = "cg_decode"
harness = false
required-features = ["encode"]

[[bench]]
name = "cg_encode"
harness = false
required-features = ["encode"]

[[bench]]
name = "cg_trellis"
harness = false
required-features = ["lab"]

