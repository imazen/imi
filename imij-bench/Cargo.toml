[package]
name = "imij-bench"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = ["lab"]
lab = ["imij/lab"]

[[bin]]
name = "imij-bench"
path = "src/main.rs"
required-features = ["lab"]

[[bin]]
name = "formats-png"
path = "src/bin/formats_png.rs"

[dependencies]
imij = { path = "../imij" }
zenpng = { path = "../../zenpng" }
zenbitmaps = { path = "../../zenbitmaps", features = ["qoi"] }
enough = "0.4.4"
rayon = "1.12.0"
linear-srgb = "0.6.12"
zenpixels = { path = "../../zenpixels/zenpixels" }
zenpixels-convert = { path = "../../zenpixels/zenpixels-convert" }
zenresize = { path = "../../zenresize" }
# Pinned before 73f938d, which breaks the hdr-pu feature (Option<&dyn Stop> mismatch).
fast-ssim2 = { git = "https://github.com/imazen/fast-ssim2", rev = "ebcd7f567b51d33777b124e877ff196866829f37", features = ["hdr-pu"] }
zenjpeg = { path = "../../zenjpeg/zenjpeg", features = ["parallel"] }
zensim = { path = "../../zensim/zensim" }
butteraugli = { path = "../../../butteraugli/butteraugli" }
# ColorVideoVDP CPU port (JOD + per-pixel diffmap), FHD display model.
cvvdp = { path = "../../zenmetrics/crates/cvvdp" }
vmaf = { path = "../../zenmetrics/crates/vmaf" }
zenyuv = "0.1.3"
imgref = "1.12.3"
rgb = "0.8.53"

[dev-dependencies]
archmage = { version = "0.9.33", features = ["avx512"] }
magetypes = { version = "0.9.33", features = ["avx512"] }
zenbench = { path = "../../zenbench" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "entropy"
harness = false
required-features = ["lab"]

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "matrix"
harness = false

[[bench]]
name = "postfilter"
harness = false

[[bench]]
name = "trellis_encode"
harness = false
required-features = ["lab"]

[workspace]

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

# Bench against the local sibling heads (dev-only; imij itself has no deps).
[patch.crates-io]
zencodec = { path = "../../zencodec" }
zenpixels = { path = "../../zenpixels/zenpixels" }
zenpixels-convert = { path = "../../zenpixels/zenpixels-convert" }
zenpng = { path = "../../zenpng" }
zenbitmaps = { path = "../../zenbitmaps" }
zenresize = { path = "../../zenresize" }
zenanalyze = { path = "../../zenanalyze" }
zenanalyze-api = { path = "../../zenanalyze/zenanalyze-api" }
